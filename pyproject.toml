[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "connectfive-jax"
version = "0.1.0"
description = "A JAX-native, PGX-compatible Connect Five environment on a 19x19 board"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Eric Hong" }]
dependencies = [
  "jax>=0.4.28",
  "pgx>=2.1.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
connectfive = "connectfive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

